[project]
name = "pinnaudit"
version = "0.1.0"
description = "A reproducible audit of when physics-informed neural networks beat classical PDE solvers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ridoy Hasan" }]
keywords = ["physics-informed-neural-networks", "pde", "scientific-machine-learning", "benchmark"]
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "polars>=0.20",
  "pydantic>=2.6",
  "pyyaml>=6",
  "typer>=0.12",
  "matplotlib>=3.8",
]

# torch is a heavy install and is not needed until Day 2's PINN, so it is an
# extra. This keeps the classical-baseline test suite fast in CI.
[project.optional-dependencies]
nn = ["torch>=2.2", "scikit-learn>=1.4"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.4", "mypy>=1.9"]

[project.scripts]
pinnaudit = "pinnaudit.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pinnaudit"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B018"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["pinnaudit"]
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["src/pinnaudit"]
