# Forward wave problem. Same layout as forward_heat.yaml.
# The finite-difference grids keep the Courant number at 0.5 (nt = 2 * (nx - 1) + 1).
name: forward_wave
seeds: [0, 1, 2, 3, 4]
variants:
  - label: fd_21
    config: configs/wave_fd.yaml
    overrides:
      solver.nx: 21
      solver.nt: 41
  - label: fd_41
    config: configs/wave_fd.yaml
    overrides:
      solver.nx: 41
      solver.nt: 81
  - label: fd_81
    config: configs/wave_fd.yaml
    overrides:
      solver.nx: 81
      solver.nt: 161
  - label: fd_161
    config: configs/wave_fd.yaml
    overrides:
      solver.nx: 161
      solver.nt: 321
  - label: fd_321
    config: configs/wave_fd.yaml
    overrides:
      solver.nx: 321
      solver.nt: 641
  - label: pinn
    config: configs/pinn_wave.yaml
  - label: pinn_lbfgs
    config: configs/pinn_wave.yaml
    overrides:
      solver.neural.lbfgs_iters: 500
  - label: pinn_data200
    config: configs/pinn_wave.yaml
    overrides:
      solver.neural.n_obs: 200
  - label: mlp_data200
    config: configs/mlp_wave.yaml
  # Loss balance: raise the initial/boundary weights against the PDE residual (weight 1).
  # Tests the hypothesis that the residual overpowers the initial condition.
  - label: pinn_w10
    config: configs/pinn_wave.yaml
    overrides:
      solver.neural.w_ic: 10.0
      solver.neural.w_bc: 10.0
  - label: pinn_w100
    config: configs/pinn_wave.yaml
    overrides:
      solver.neural.w_ic: 100.0
      solver.neural.w_bc: 100.0
  - label: pinn_w1000
    config: configs/pinn_wave.yaml
    overrides:
      solver.neural.w_ic: 1000.0
      solver.neural.w_bc: 1000.0
