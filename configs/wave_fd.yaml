# Reference leapfrog run for the 1D wave equation.
# Courant number lam = c*k/h = 0.5, deliberately below 1: at lam = 1 exactly
# the scheme reproduces the analytic solution to machine precision, which
# would make a convergence study meaningless. See docs/LOG.md.
run_id: wave_fd_leapfrog
seed: 0
out_dir: results
problem:
  name: wave1d
  x_max: 1.0
  t_max: 1.0
  c: 1.0
  displacement_modes:
    - {n: 1, amplitude: 1.0}
    - {n: 3, amplitude: 0.5}
  velocity_modes: []
solver:
  name: fd_wave_leapfrog
  nx: 41
  nt: 81
